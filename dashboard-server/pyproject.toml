[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "takeoverbench"
version = "0.1.0"
description = "A research dashboard for Takeover Requests (TOR) in conditionally automated vehicles"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "paho-mqtt",
    "numpy",
    "opencv-python",
    "pygame",
    "reportlab",
    "svglib",
    "python-dotenv",
    "amqtt",
]

[tool.setuptools.packages.find]
include = ["sim*"]

[tool.ruff]
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
